<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpolyline points=%220,9 5,9 7,3 9,14 11,9 16,9%22 fill=%22none%22 stroke=%22%231e6b47%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preload" href="/static/recursive.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/uPlot.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><svg viewBox="0 0 30 16" aria-hidden="true"><polyline points="0,9 10,9 13,3 16,14 19,9 30,9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>runboard</span></div>
  <div class="controls">
    <label>Project
      <select id="project"></select>
    </label>
    <label>X axis
      <select id="xmode">
        <option value="step">Step</option>
        <option value="rel">Relative time (min)</option>
        <option value="wall">Wall clock</option>
      </select>
    </label>
    <label class="smooth">Smoothing <span id="smooth-val">0</span>
      <input id="smooth" type="range" min="0" max="0.99" step="0.01" value="0">
    </label>
    <label class="check"><input id="logy" type="checkbox"> Log y</label>
    <input id="metric-filter" type="search" placeholder="Filter metrics (regex)">
    <button id="theme" class="theme-button" type="button" aria-label="Change color theme">System theme</button>
    <span id="live" class="live" title="Refreshes every 5 seconds while this tab is open"><span class="dot"></span><span id="live-text">live</span></span>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <input id="run-filter" type="search" placeholder="Search runs">
    <div class="sidebar-actions">
      <button id="select-none" type="button">Clear selection</button>
      <span id="sel-count" class="muted"></span>
    </div>
    <ul id="runs" class="runs"></ul>
  </aside>
  <main>
    <div id="message" class="message" hidden></div>
    <details id="summary-wrap" class="summary">
      <summary>Summary table</summary>
      <div class="table-scroll"><table id="summary"></table></div>
    </details>
    <div id="charts"></div>
  </main>
</div>
<dialog id="details">
  <form method="dialog"><button class="close" aria-label="Close">✕</button></form>
  <h3 id="details-title"></h3>
  <pre id="details-body"></pre>
</dialog>
<script src="/static/uPlot.iife.min.js"></script>
<script src="/static/binned.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
