[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runboard"
version = "0.2.0"
description = "Self-hosted, W&B-style live training dashboards for any cluster or VM, viewable in your browser without SSH."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Mohammad Zbeeb", email = "mhmdzbyb829@gmail.com" }]
keywords = ["machine-learning", "experiment-tracking", "training", "dashboard", "metrics", "slurm", "cluster", "wandb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Moe-Zbeeb/runboard"
Documentation = "https://github.com/Moe-Zbeeb/runboard#readme"
Issues = "https://github.com/Moe-Zbeeb/runboard/issues"
Changelog = "https://github.com/Moe-Zbeeb/runboard/blob/main/CHANGELOG.md"

[project.scripts]
runboard = "runboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runboard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
