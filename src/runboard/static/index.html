<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpolyline points=%220,9 5,9 7,3 9,14 11,9 16,9%22 fill=%22none%22 stroke=%22%231e6b47%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preload" href="/static/recursive.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/uPlot.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar" class="topbar">
  <div class="brand"><svg viewBox="0 0 30 16" aria-hidden="true"><polyline points="0,9 10,9 13,3 16,14 19,9 30,9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span>runboard</span><span id="live" class="live" title="Refreshes every 5 seconds while this tab is open"><span class="dot"></span><span id="live-text">live</span></span></div>
  <div class="controls">
    <label>Project
      <select id="project"></select>
    </label>
    <label>X axis
      <select id="xmode">
        <option value="step">Step</option>
        <option value="rel">Elapsed (min)</option>
        <option value="wall">Wall clock</option>
      </select>
    </label>
    <label class="smooth">Smoothing <span id="smooth-val">0</span>
      <input id="smooth" type="range" min="0" max="0.99" step="0.01" value="0">
    </label>
    <label class="check"><input id="logy" type="checkbox"> Log y</label>
    <label class="check" title="Scale the y axis to the 1st–99th percentile so rare spikes do not flatten the curve"><input id="clip" type="checkbox"> Clip outliers</label>
    <input id="metric-filter" type="search" placeholder="Filter metrics (regex)" aria-label="Filter metrics" spellcheck="false">
    <label>Theme
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>
</header>
<div class="layout">
  <aside id="sidebar" class="sidebar">
    <button id="runs-toggle" class="runs-toggle" type="button" aria-expanded="false" aria-controls="runs-panel"><span>Runs</span><span id="runs-toggle-count" class="muted"></span></button>
    <div id="runs-panel" class="runs-panel">
      <input id="run-filter" type="search" placeholder="Search runs" aria-label="Search runs" spellcheck="false">
      <div class="sidebar-actions">
        <button id="select-none" type="button">Clear selection</button>
        <span id="sel-count" class="muted"></span>
      </div>
      <ul id="runs" class="runs"></ul>
    </div>
  </aside>
  <main>
    <div id="message" class="message" hidden></div>
    <details id="summary-wrap" class="summary">
      <summary>Compare runs</summary>
      <div class="table-scroll"><table id="summary"></table></div>
    </details>
    <div id="charts"></div>
  </main>
</div>
<div id="zoombar" class="zoombar" role="status" hidden><span id="zoom-range"></span><button id="reset-zoom" type="button">Reset zoom</button></div>
<dialog id="details" aria-labelledby="details-title">
  <form method="dialog"><button class="close" aria-label="Close">✕</button></form>
  <h3 id="details-title"></h3>
  <div id="details-body"></div>
</dialog>
<script src="/static/uPlot.iife.min.js"></script>
<script src="/static/binned.js"></script>
<script src="/static/view.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
