name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/runboard --version
          /tmp/smoke/bin/python -c "import runboard, pathlib; assert (pathlib.Path(runboard.__file__).parent / 'static' / 'index.html').exists()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:cloud
      - run: |
          printf 'RUNBOARD_TOKEN=integration-token\n' > .dev.vars
          npm run dev -- --port 8787 > /tmp/runboard-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'Authorization: Bearer integration-token' http://127.0.0.1:8787/api/health; then
              break
            fi
            sleep 1
          done
          RUNBOARD_TEST_URL=http://127.0.0.1:8787 RUNBOARD_TEST_TOKEN=integration-token npm run test:cloud
